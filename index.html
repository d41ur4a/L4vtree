on. From building ventures in the chemical industry to exploring artificial intelligence, systems, and ideas that challenge convention, I'm drawn to turning possibilities into something real.</p><p>This is a collection of what I build, what I explore, and what I choose to preserve.</p><div class="cards"><article class="card"><h3>Get in touch</h3><p>For ideas, business and collaboration.</p><a href="mailto:l4v@druidchem.com">l4v@druidchem.com ↗</a><a href="https://www.linkedin.com/in/lav-mittal-354899250" target="_blank" rel="noopener noreferrer" data-track="linkedin">LINKEDIN ↗</a><a href="https://www.instagram.com/l4vus/" target="_blank" rel="noopener noreferrer" data-track="instagram">INSTAGRAM ↗</a><a href="https://www.pinterest.com/dadruid/" target="_blank" rel="noopener noreferrer" data-track="pinterest">PINTEREST ↗</a></article></div>`};

const panel=document.getElementById('panel'), content=document.getElementById('panelContent'), hero=document.getElementById('hero'), rooms=document.querySelector('.rooms');let active=null;const order=['ventures','soundscapes','laboratory','about'];function show(room){active=room&&data[room]?room:null;panel.classList.toggle('show',!!active);hero.classList.toggle('hidden',!!active);document.querySelector('.access-rail').classList.toggle('hidden',!!active);rooms.classList.toggle('hidden',!!active);if(active)content.innerHTML=data[active];document.querySelectorAll('[data-room]').forEach(b=>{b.classList.toggle('active',b.dataset.room===active);b.setAttribute('aria-pressed',String(b.dataset.room===active))});history.replaceState(null,'',active?'#'+active:location.pathname+location.search);window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.room)));document.querySelectorAll('[data-room-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();show(a.dataset.roomLink)}));document.getElementById('back').addEventListener('click',()=>show(null));document.addEventListener('keydown',e=>{if(e.key==='Escape')show(null);if(active&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))show(order[(order.indexOf(active)+(e.key==='ArrowRight'?1:3))%4])});let x=0,y=0;document.addEventListener('touchstart',e=>{x=e.changedTouches[0].screenX;y=e.changedTouches[0].screenY},{passive:true});document.addEventListener('touchend',e=>{if(!active)return;const dx=e.changedTouches[0].screenX-x,dy=e.changedTouches[0].screenY-y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.4)show(order[(order.indexOf(active)+(dx<0?1:3))%4])},{passive:true});if(data[location.hash.slice(1)])show(location.hash.slice(1));
